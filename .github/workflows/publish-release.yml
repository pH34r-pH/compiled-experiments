name: publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true
        type: string
      experiment_id:
        description: 'Experiment directory ID'
        required: true
        type: string
      expected_sha256:
        description: 'Canonical compiled ZIP SHA-256'
        required: true
        type: string
      archive_commit:
        description: 'Reviewed archive main commit (full SHA)'
        required: true
        type: string
      compiler_commit:
        description: 'Reviewed Compiler builder commit (full SHA)'
        required: true
        type: string

permissions: {}

concurrency:
  group: archival-publication
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'pH34r-pH/compiled-experiments' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == github.repository_owner_id &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Verify exact archive candidate and Compiler provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          ARCHIVE_COMMIT: ${{ inputs.archive_commit }}
          COMPILER_COMMIT: ${{ inputs.compiler_commit }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/tags/$TAG"
          python scripts/check_release_candidate.py \
            --experiment-id="$EXPERIMENT_ID" --sha256="$EXPECTED_SHA256" \
            --archive-commit="$ARCHIVE_COMMIT" --compiler-commit="$COMPILER_COMMIT"

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          EXPECTED_SHA256: ${{ inputs.expected_sha256 }}
          ARCHIVE_COMMIT: ${{ inputs.archive_commit }}
          COMPILER_COMMIT: ${{ inputs.compiler_commit }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ARCHIVE_COMMIT"
          git push origin "$ARCHIVE_COMMIT:refs/tags/$TAG"
          {
            printf 'Public reproducibility artifact for `%s`.\n\n' "$EXPERIMENT_ID"
            printf -- '- Canonical package SHA-256: `%s`\n' "$EXPECTED_SHA256"
            printf -- '- Compiler builder commit: `%s`\n' "$COMPILER_COMMIT"
            printf -- '- [Archive and provenance verification](%s/%s/actions/runs/%s)\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'See the experiment README for its scientific result and reproducibility scope.\n'
          } > "$RUNNER_TEMP/release-notes.md"
          gh release create --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" -- "$TAG"
